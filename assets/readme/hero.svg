<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Yash Kumar - Portfolio</title>
  <desc id="desc">Software Developer specializing in high-performance system utilities and multiplatform applications.</desc>
  
  <defs>
    <clipPath id="avatar-clip">
      <rect x="60" y="60" width="180" height="180" rx="12" />
    </clipPath>
  </defs>

  <rect width="1200" height="300" rx="8" fill="#0d1117"/>
  
  <!-- Avatar Image -->
  <image href="https://avatars.githubusercontent.com/u/197374270?v=4" x="60" y="60" width="180" height="180" clip-path="url(#avatar-clip)"/>

  <!-- Left Title Block -->
  <g transform="translate(270, 70)">
    <text x="0" y="10" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="600" fill="#58a6ff" letter-spacing="3">SYSTEMS &amp; MULTIPLATFORM</text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="800" fill="#f0f6fc">Yash Kumar</text>
    <text x="0" y="110" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="400" fill="#c9d1d9">High-performance utilities &amp; native desktop applications</text>
    <text x="0" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#8b949e">BCA Student @ Mangalayatan University • Expected Oct 2026</text>
  </g>

  <!-- Right Schematic Diagram (x=740, y=50) -->
  <g transform="translate(740, 50)">
    <!-- Grid Background -->
    <path d="M 0,0 L 400,0 L 400,200 L 0,200 Z" fill="none" stroke="#30363d" stroke-width="1"/>
    <path d="M 200,0 L 200,200 M 0,100 L 400,100" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Top Left: Imbric VFS (File Tree) -->
    <g transform="translate(15, 20)">
      <rect width="170" height="60" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#58a6ff">IMBRIC VFS</text>
      <text x="15" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8b949e">ifs/ • core/ • app/</text>
      <!-- Mini tree icon -->
      <path d="M 140,20 L 140,40 M 140,30 L 150,30 M 140,40 L 150,40" stroke="#58a6ff" stroke-width="1.5"/>
    </g>

    <!-- Top Right: SpaceBoard (Treemap Grid) -->
    <g transform="translate(215, 20)">
      <rect width="170" height="60" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#58a6ff">SPACEBOARD</text>
      <text x="15" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8b949e">GPU Treemap Engine</text>
      <!-- Mini treemap icon -->
      <rect x="135" y="20" width="20" height="20" fill="none" stroke="#58a6ff" stroke-width="1"/>
      <line x1="145" y1="20" x2="145" y2="40" stroke="#58a6ff" stroke-width="1"/>
      <line x1="145" y1="30" x2="155" y2="30" stroke="#58a6ff" stroke-width="1"/>
    </g>

    <!-- Bottom Left: NNS (Neural Net / Waveform) -->
    <g transform="translate(15, 120)">
      <rect width="170" height="60" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#58a6ff">NNS</text>
      <text x="15" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8b949e">Neural Noise Suppr.</text>
      <!-- Mini wave icon -->
      <path d="M 135,30 Q 140,20 145,30 T 155,30" fill="none" stroke="#58a6ff" stroke-width="1.5"/>
    </g>

    <!-- Bottom Right: Z-RAM Manager (Swap/Memory) -->
    <g transform="translate(215, 120)">
      <rect width="170" height="60" rx="4" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text x="15" y="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold" fill="#58a6ff">Z-RAM MANAGER</text>
      <text x="15" y="45" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8b949e">Linux Swap &amp; Hibern.</text>
      <!-- Mini memory icon -->
      <rect x="135" y="25" width="20" height="10" rx="1" fill="none" stroke="#58a6ff" stroke-width="1"/>
      <line x1="138" y1="22" x2="138" y2="25" stroke="#58a6ff" stroke-width="1"/>
      <line x1="142" y1="22" x2="142" y2="25" stroke="#58a6ff" stroke-width="1"/>
      <line x1="146" y1="22" x2="146" y2="25" stroke="#58a6ff" stroke-width="1"/>
      <line x1="150" y1="22" x2="150" y2="25" stroke="#58a6ff" stroke-width="1"/>
    </g>
  </g>
</svg>
